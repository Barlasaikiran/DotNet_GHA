name: ci Build .net application
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: install dotnet
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.0.x'
            - name: restore dependencies
              run: dotnet restore
            - name: build application
              run: dotnet build --no-restore

